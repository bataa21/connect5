  <style>
    /* ——— your CSS exactly as you shared ——— */
    :root{--primary:#4361ee;--secondary:#3a0ca3;--accent:#f72585;--dark:#212529;--light:#fff;--success:#4cc9f0;--danger:#f72585;--radius:12px;--shadow:0 4px 20px rgba(0,0,0,.08)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{overflow-x:hidden;overflow-y:auto;background:linear-gradient(135deg,#f5f7fa 0%,#e4e8f0 100%)}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--dark);min-height:100vh;display:flex;flex-direction:column}
    .app{width:100%;max-width:980px;margin:0 auto;padding:12px 14px 20px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;min-height:100svh}
    .board { overflow: visible; }
    @supports(padding:max(0px)){.app{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}}
    .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
    .topbar-left{min-width:0}
    .title{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:800;color:var(--secondary);text-align:center;justify-self:center}
    .top-actions{justify-self:end;display:flex;gap:8px;align-items:center}
    .select{appearance:none;background:#fff;border:1px solid #dee2e6;border-radius:10px;padding:8px 12px;font-weight:600}
    .btn{border:none;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:.2s}
    .btn:hover{background:var(--secondary);transform:translateY(-1px)}
    .btn.alt{background:#4cc9f0}
    .btn.ghost{background:#111827}
    .btn:disabled{background:#adb5bd;transform:none;cursor:not-allowed}
    .toolbar{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
    .segmented{display:flex;border:1px solid #dee2e6;border-radius:10px;overflow:hidden;background:#fff}
    .segmented .seg{padding:8px 12px;font-weight:700;cursor:pointer;border-right:1px solid #eee;user-select:none;background:#fff;color:#333}
    .segmented .seg:last-child{border-right:none}
    .segmented .seg.active{background:#eef2ff;color:#1d2cf3}
    .toolbar .group{display:flex;gap:8px;align-items:center}
    .toolbar .divider{width:1px;height:28px;background:#e9ecef}
    .board-wrap{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-start;min-height:0}
    .notice{min-height:38px;display:flex;align-items:center;justify-content:center}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid;font-weight:800;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);opacity:1;transform:translateY(0);transition:opacity .18s,transform .18s}
    .pill--success{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
    .pill--warning{background:#fff7ed;color:#92400e;border-color:#fed7aa}
    .pill--info{background:#eef2ff;color:#1e40af;border-color:#c7d2fe}
    .status{min-height:24px;text-align:center;color:#6c757d;font-style:italic;font-weight:600}
    .board{display:grid;gap:3px;background:#e9ecef;border-radius:8px;padding:5px;width:clamp(280px,92svw,520px);max-width:520px;aspect-ratio:1/1;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));margin-inline:auto}
    .cell{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.2rem,2.7vw,1.9rem);border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.05);cursor:pointer;user-select:none;touch-action:manipulation;will-change:transform;transition:background-color .1s, box-shadow .1s}

    .cell { position: relative; z-index: 0; line-height: 1; }
    .cell:active{background:#f1f3f5;box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
    @media(hover:hover){.cell:hover{transform:scale(1.03)}}
    .cell.x{color:var(--success)} .cell.o{color:var(--danger)}
    .cell.winning{background:rgba(255,215,0,.25);animation:pulse 1s infinite alternate}
    
    .cell-last-move {
  position: relative;
  z-index: 3;
  outline: 3px solid var(--accent);
  outline-offset: -3px;  /* draw just inside the cell */
  box-shadow: none;
}
    @keyframes pulse{from{background:rgba(255,215,0,.2)} to{background:rgba(255,215,0,.4)}}
    @keyframes winPulse{0%{background-color:#f5f7fa}50%{background-color:#caffd1}100%{background-color:#f5f7fa}}
    .win-effect{animation:winPulse .6s ease-in-out 8}
    .toast-container{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:grid;gap:8px;z-index:99999;pointer-events:none}
    .toast{pointer-events:auto;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:700;font-size:.95rem;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast--success{background:#065f46}.toast--warning{background:#92400e}.toast--info{background:#1f2937}
    @media(min-width:992px){html,body{overflow:hidden}.app{height:100vh;min-height:100vh;grid-template-rows:auto auto 1fr auto;padding:12px 18px}.board{width:min(62vmin,540px);max-width:60vh}.title{font-size:1.8rem}}
    @media(max-width:360px){.btn,.select,.segmented .seg{padding:7px 10px}.title{font-size:1.2rem}}
  </style>

  <!-- Welcome overlay -->

    <div class="topbar">

          <option value="mn">Монгол</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <div class="group">
        <div class="segmented" id="modeSegment">
          <div class="seg" id="segFriend">👥 <span class="seg-text">Friend</span></div>
          <div class="seg active" id="segAI">🤖 <span class="seg-text">AI</span></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="group">
        <select id="difficulty" class="select">
          <option value="easy">Хялбар</option>
          <option value="medium">Дунд</option>
          <option value="hard" selected>Хэцүү</option>
        </select>
      </div>
      <div class="group">
        <button id="resetButton" class="btn">Шинэ</button>
        <button id="alternateStartButton" class="btn">Ai эхлэх</button>
      </div>
    </div>

    <div class="board-wrap">
      <div id="banner" class="notice"></div>
      <div id="thinking" class="status"></div>
      <div id="board" class="board"></div>
    </div>

    <div id="toastHost" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  </div>
